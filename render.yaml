services:
  - type: web
    name: sistema-gestao-jr-sul
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_USER
        value: jradmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
